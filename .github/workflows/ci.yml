name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: ESC-tags
        run: npm run esc:check

      - name: Tests
        run: npm test

      # vue-tsc -b i.p.v. --noEmit: tsconfig.node.json is een composite
      # reference waarvan de output eerst gebouwd moet zijn (anders TS6305).
      - name: Typecheck & build
        run: npm run build

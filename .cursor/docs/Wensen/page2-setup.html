<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Setup</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: #0d1117;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
  }

  /* Stepper */
  .stepper {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 40px 0;
    gap: 0;
  }
  .step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    position: relative;
  }
  .step-circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.95rem;
    background: #1e2430;
    color: #6b7280;
    border: 2px solid #374151;
    position: relative;
    z-index: 1;
  }
  .step.active .step-circle {
    background: #7c3aed;
    color: #fff;
    border-color: #7c3aed;
  }
  .step-label {
    font-size: 0.8rem;
    color: #6b7280;
    white-space: nowrap;
  }
  .step.active .step-label { color: #ffffff; font-weight: 600; }
  .step-line {
    flex: 1;
    height: 2px;
    background: #374151;
    margin-top: 20px;
    min-width: 80px;
    max-width: 160px;
  }

  /* Card */
  .main {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 120px);
    padding: 40px 20px;
  }
  .card {
    background: #161b24;
    border: 1px solid #21293a;
    border-radius: 14px;
    padding: 40px 48px;
    width: 100%;
    max-width: 520px;
  }
  .card h2 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 28px;
  }
  .field-label {
    font-size: 0.95rem;
    font-weight: 500;
    color: #e5e7eb;
    margin-bottom: 10px;
  }
  .input-text {
    width: 100%;
    background: #1e2430;
    border: 1px solid #2d3748;
    border-radius: 8px;
    padding: 12px 16px;
    color: #9ca3af;
    font-size: 0.95rem;
    outline: none;
    margin-bottom: 24px;
  }
  .input-text:focus { border-color: #7c3aed; color: #fff; }

  .counter-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 12px;
  }
  .counter-btn {
    width: 40px;
    height: 40px;
    background: #1e2430;
    border: 1px solid #374151;
    border-radius: 8px;
    color: #fff;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .counter-btn:hover { background: #2d3748; }
  .counter-val {
    font-size: 1.4rem;
    font-weight: 600;
    min-width: 24px;
    text-align: center;
  }
  .hint {
    font-size: 0.82rem;
    color: #6b7280;
    line-height: 1.5;
    margin-bottom: 32px;
  }
  .divider { border: none; border-top: 1px solid #21293a; margin-bottom: 24px; }
  .btn-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .btn-back {
    background: none;
    border: none;
    color: #9ca3af;
    font-size: 0.95rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }
  .btn-back:hover { color: #fff; }
  .btn-continue {
    background: #7c3aed;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 28px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    transition: background 0.2s;
  }
  .btn-continue:hover { background: #6d28d9; }
</style>
</head>
<body>
  <div class="stepper">
    <div class="step active">
      <div class="step-circle">1</div>
      <span class="step-label">Project Info</span>
    </div>
    <div class="step-line"></div>
    <div class="step">
      <div class="step-circle">2</div>
      <span class="step-label">Floor Setup</span>
    </div>
    <div class="step-line"></div>
    <div class="step">
      <div class="step-circle">3</div>
      <span class="step-label">Scale &amp; Measure</span>
    </div>
    <div class="step-line"></div>
    <div class="step">
      <div class="step-circle">4</div>
      <span class="step-label">Process</span>
    </div>
  </div>

  <div class="main">
    <div class="card">
      <h2>Project Details</h2>
      <p class="field-label">Project Name</p>
      <input class="input-text" type="text" placeholder="Enter project name...">
      <p class="field-label">Number of Floors</p>
      <div class="counter-row">
        <button class="counter-btn" onclick="change(-1)">−</button>
        <span class="counter-val" id="count">1</span>
        <button class="counter-btn" onclick="change(1)">+</button>
      </div>
      <p class="hint">You'll configure each floor with its blueprint and facade images in the next step.</p>
      <hr class="divider">
      <div class="btn-row">
        <a href="page1-home.html" class="btn-back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back
        </a>
        <a href="page3-floor-config.html" class="btn-continue">
          Continue
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </a>
      </div>
    </div>
  </div>

  <script>
    let count = 1;
    function change(d) {
      count = Math.max(1, count + d);
      document.getElementById('count').textContent = count;
    }
  </script>
</body>
</html>
